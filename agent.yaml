# Agent Manifest — resume-sync 的自描述清单
# 此文件供 Agent-hub 只读，配置变更请手动编辑。

name: resume-sync
display_name: 简历同步器
description: |
  自动化简历维护工具。检测 Git 项目变更 → 读取 agent.yaml 发现调度/子项目关系 →
  LLM 三阶段流水线（生成-审查-修订）生成大厂风格(FAANG)简历要点 →
  更新 LaTeX 源文件 → 编译 PDF。支持 Windows 计划任务定时后台运行，主动推送变更通知。

  核心特色：自动读取项目的 agent.yaml，若发现 scheduled_agents 声明，
  会在生成简历要点时注入子项目/调度关系上下文，使 LLM 能产出体现
  系统架构层级的描述（例如"设计了一套多 Agent 协同调度系统"而非"做了 3 个 Agent"）。
protocol: cli
version: "1.0"

capabilities:
  tasks:
    - name: check
      description: 检查所有追踪项目的 Git 新提交和变更（如：检查 omniagent/smartbench 是否有新代码需要更新简历）
      input:
        project: "string — 项目名（可选，不传则检查全部追踪项目）"
      output:
        commits: "list"
        diff: "string"
        has_changes: "bool"

    - name: plan
      description: |
        基于 Git diff 通过 LLM 三阶段流水线生成简历要点（生成→自审→修订，评分阈值 8.5/10，润色阈值 9.0/10）。
        自动读取项目 agent.yaml 中的 scheduled_agents 声明，为调度系统类项目注入
        子 Agent 关系上下文，使生成的简历体现多 Agent 协同架构而非独立工具列表。
      input:
        project: "string — 要生成要点的项目名"
      output:
        bullets: "list — [{text, score, keywords}]"

    - name: apply
      description: 将已生成的简历要点写入 LaTeX 源文件（不传 bullets 则使用缓存的最新 plan 结果）
      input:
        bullets: "list — 要点列表（可选）"
      output:
        tex_backup: "string"
        status: "string"

    - name: build
      description: 编译 LaTeX 源文件生成最终的 PDF 简历
      input: {}
      output:
        pdf_path: "string — 编译后的 PDF 路径"

    - name: run
      description: 完整自动化流水线：check → plan → apply → build（一键更新简历，如"帮我更新简历"或"同步最新代码到简历"）
      input:
        project: "string — 要检查的项目（可选，默认全部追踪项目）"
      output:
        pipeline_status: "dict"
        pdf_path: "string — 输出 PDF 路径"

    - name: polish
      description: |
        润色已有简历要点的可读性和表达力（无需新提交）。重写现有 bullet points
        使其更凝练、更有冲击力，使用强有力的动词开头。
      input:
        project: "string — 要润色的项目名（可选）"
      output:
        bullets: "list — [{text, score, keywords}]"

    - name: status
      description: 查看所有被追踪项目的当前状态（上次检查时间、是否有待处理变更）
      input: {}
      output:
        projects: "list — [{name, last_commit, pending_changes}]"

  constraints:
    requires_env: ["DEEPSEEK_API_KEY"]
    batch_mode_only: true

interface:
  command: cd /home/xianyu-sheng/resume-sync && /home/xianyu-sheng/resume-sync/.venv/bin/python -m src.cli {task} {project}
