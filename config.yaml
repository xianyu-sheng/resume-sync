# ============================================================
# Resume-Sync Configuration
# ============================================================

resume:
  tex_path: "/home/xianyu-sheng/resume-sync/resume-tex/main.tex"
  pdf_output: "/home/xianyu-sheng/resume-sync/output/Agent开发简历_.pdf"

projects:
  - key: omniagent
    name: "OmniAgent"
    repo_local: "/home/xianyu-sheng/OmniAgent_CLI"
    enabled: true
  - key: smartbench
    name: "SmartBench"
    repo_local: "/home/xianyu-sheng/SmartBench"
    enabled: true
  - key: agent-hub
    name: "Agent Hub"
    repo_local: "/home/xianyu-sheng/Agent-hub"
    enabled: true

llm:
  provider: "deepseek"
  api_key: "${DEEPSEEK_API_KEY}"
  api_base: "https://api.deepseek.com/v1"
  model: "deepseek-chat"

build:
  engine: "latexmk"
  args: ["-xelatex", "-interaction=nonstopmode"]
  backup: true
  backup_dir: "/home/xianyu-sheng/resume-sync/backups"

review:
  enabled: true            # 多轮审查开关
  max_rounds: 3            # 最大审查轮数（生成→审查→修订→审查→...）
  pass_threshold: 8.5      # 加权总分达到此值 + 所有维度 ≥ 5 分 才通过（FAANG 标准建议 ≥ 8.5）

daemon:
  interval_minutes: 30
  auto_apply: false
  notify_on_change: true
